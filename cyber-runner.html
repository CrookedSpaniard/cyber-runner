<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>IT Department Cyber Runner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Share Tech Mono', monospace;
    touch-action: none;
  }
  #gameWrapper {
    position: relative;
    width: 100%;
    max-width: 800px;
  }
  canvas {
    display: block;
    width: 100%;
    image-rendering: pixelated;
    border: 1px solid #00FFFF22;
    box-shadow: 0 0 30px #00FFFF33, 0 0 60px #FF00FF11, inset 0 0 30px #00000088;
  }
  #ui {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 12px 18px;
    pointer-events: none;
  }
  .ui-block { display: flex; flex-direction: column; gap: 2px; }
  .ui-label { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: #00FFFF99; letter-spacing: 2px; text-transform: uppercase; }
  .ui-value { font-family: 'Orbitron', monospace; font-size: 22px; font-weight: 700; color: #00FFFF; text-shadow: 0 0 10px #00FFFF, 0 0 20px #00FFFF88; letter-spacing: 2px; }
  .ui-value.hi { color: #FF00FF; text-shadow: 0 0 10px #FF00FF, 0 0 20px #FF00FF88; }
  #levelDisplay { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: #00FF4199; letter-spacing: 2px; text-align: center; padding-top: 4px; }
  #mobileHint {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    font-family: 'Share Tech Mono', monospace; font-size: 11px; color: #ffffff33;
    letter-spacing: 2px; pointer-events: none; white-space: nowrap;
  }
</style>
</head>
<body>
<div id="gameWrapper">
  <canvas id="c" width="800" height="300"></canvas>
  <div id="ui">
    <div class="ui-block">
      <span class="ui-label">Score</span>
      <span class="ui-value" id="scoreDisplay">00000</span>
    </div>
    <div class="ui-block" style="align-items:center">
      <span class="ui-label" style="text-align:center">Level</span>
      <span class="ui-value" id="levelDisplay" style="font-size:18px;color:#00FF41;text-shadow:0 0 10px #00FF41">01</span>
    </div>
    <div class="ui-block" style="align-items:flex-end">
      <span class="ui-label">Best</span>
      <span class="ui-value hi" id="hiDisplay">00000</span>
    </div>
  </div>
  <div id="mobileHint">TAP TO JUMP · DOUBLE TAP = DOUBLE JUMP</div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 800, H = 300;
canvas.width = W; canvas.height = H;

// ─── AUDIO ──────────────────────────────────────────────
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playSound(type) {
  try {
    const ac = getAudio();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain); gain.connect(ac.destination);
    if (type === 'jump1') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(220, ac.currentTime);
      osc.frequency.exponentialRampToValueAtTime(440, ac.currentTime + 0.12);
      gain.gain.setValueAtTime(0.18, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.15);
      osc.start(); osc.stop(ac.currentTime + 0.15);
    } else if (type === 'jump2') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(330, ac.currentTime);
      osc.frequency.exponentialRampToValueAtTime(660, ac.currentTime + 0.1);
      gain.gain.setValueAtTime(0.15, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.13);
      osc.start(); osc.stop(ac.currentTime + 0.13);
      // extra blip
      const osc2 = ac.createOscillator();
      const g2 = ac.createGain();
      osc2.connect(g2); g2.connect(ac.destination);
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(880, ac.currentTime + 0.05);
      g2.gain.setValueAtTime(0.1, ac.currentTime + 0.05);
      g2.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.18);
      osc2.start(ac.currentTime + 0.05); osc2.stop(ac.currentTime + 0.18);
    } else if (type === 'crash') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, ac.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, ac.currentTime + 0.4);
      gain.gain.setValueAtTime(0.35, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.45);
      osc.start(); osc.stop(ac.currentTime + 0.45);
      // noise burst
      const buf = ac.createBuffer(1, ac.sampleRate * 0.3, ac.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i/data.length);
      const src = ac.createBufferSource();
      src.buffer = buf;
      const ng = ac.createGain(); ng.gain.value = 0.25;
      src.connect(ng); ng.connect(ac.destination);
      src.start();
    } else if (type === 'levelup') {
      const notes = [440, 554, 659, 880];
      notes.forEach((freq, i) => {
        const o = ac.createOscillator();
        const g = ac.createGain();
        o.connect(g); g.connect(ac.destination);
        o.type = 'square';
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.12, ac.currentTime + i*0.08);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + i*0.08 + 0.1);
        o.start(ac.currentTime + i*0.08);
        o.stop(ac.currentTime + i*0.08 + 0.1);
      });
    }
  } catch(e) {}
}

// ─── PALETTE ───────────────────────────────────────────
const C = {
  cyan:'#00FFFF', magenta:'#FF00FF', green:'#00FF41',
  yellow:'#FFD700', red:'#FF2244', white:'#EEEEFF',
  orange:'#FF8800', purple:'#AA00FF',
};

// ─── STATE ─────────────────────────────────────────────
let state = 'start';
let score = 0;
let hi = parseInt(localStorage.getItem('cyberHi') || '0');
let frame = 0;
let speed = 4;
let gameTime = 0;
let level = 1;
let levelUpTimer = 0;
let levelUpMsg = '';

// ─── RAIN ───────────────────────────────────────────────
const RAIN = Array.from({length:40}, () => ({
  x: Math.random()*W, y: Math.random()*H,
  speed: 1.5+Math.random()*2, len: 8+Math.random()*18,
  alpha: 0.05+Math.random()*0.15, char: Math.floor(Math.random()*10),
}));

// ─── BUILDINGS ──────────────────────────────────────────
const BUILDINGS = Array.from({length:12}, (_, i) => ({
  x: (i/12)*W*1.5, w: 40+Math.random()*80, h: 60+Math.random()*120,
  color: Math.random()>0.5 ? C.cyan : C.magenta,
  windows: Array.from({length:6}, () => ({on: Math.random()>0.4, timer: Math.floor(Math.random()*120)})),
}));

// ─── PARTICLES ──────────────────────────────────────────
let particles = [];
function spawnParticles(x, y, color, n=8) {
  for (let i=0;i<n;i++) {
    const ang = Math.random()*Math.PI*2, spd = 1+Math.random()*4;
    particles.push({x,y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd-2,
      life:1, decay:0.04+Math.random()*0.04, color, size:2+Math.random()*3});
  }
}

// ─── GROUND ─────────────────────────────────────────────
const GROUND_Y = H - 60;
let groundOffset = 0;

// ─── PLAYER ─────────────────────────────────────────────
const player = {
  x:100, y:GROUND_Y, w:28, h:36,
  vy:0, jumps:0, maxJumps:2, grounded:false,
  animFrame:0, animTimer:0, trail:[],
  ducking: false,
};

function jump() {
  if (state==='start'||state==='dead') { startGame(); return; }
  if (player.jumps < player.maxJumps) {
    const isDouble = player.jumps === 1;
    player.vy = isDouble ? -9 : -11;
    player.jumps++;
    player.grounded = false;
    player.ducking = false;
    const col = isDouble ? C.magenta : C.cyan;
    spawnParticles(player.x+player.w/2, player.y+player.h, col, 10);
    playSound(isDouble ? 'jump2' : 'jump1');
  }
}

function duck(active) {
  if (state !== 'playing') return;
  player.ducking = active && player.grounded;
}

// ─── OBSTACLE TYPES ─────────────────────────────────────
function glow(c,color,blur){c.shadowColor=color;c.shadowBlur=blur;}
function clearGlow(c){c.shadowColor='transparent';c.shadowBlur=0;}
function roundRect(c,x,y,w,h,r){
  c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);
  c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);
  c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);
  c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);
  c.quadraticCurveTo(x,y,x+r,y);c.closePath();
}
function fmt(n){return String(Math.floor(n)).padStart(5,'0');}

// Ground obstacles
const GROUND_OBS = [
  { id:'virus', w:22, h:30, color:C.magenta,
    draw(c,x,y,w,h,t){
      c.save();c.translate(x+w/2,y+h/2);c.rotate(Math.sin(t*0.05)*0.2);
      const g=c.createRadialGradient(0,0,2,0,0,w/2);
      g.addColorStop(0,'#FF88FF');g.addColorStop(1,C.magenta+'88');
      c.fillStyle=g;c.beginPath();
      for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2-Math.PI/6;
        i===0?c.moveTo(Math.cos(a)*w/2,Math.sin(a)*h/2):c.lineTo(Math.cos(a)*w/2,Math.sin(a)*h/2);}
      c.closePath();c.fill();glow(c,C.magenta,12);c.strokeStyle=C.magenta;c.lineWidth=1.5;c.stroke();
      for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2;c.beginPath();
        c.moveTo(Math.cos(a)*w/2,Math.sin(a)*h/2);c.lineTo(Math.cos(a)*(w/2+6),Math.sin(a)*(h/2+6));c.stroke();}
      c.restore();
    }
  },
  { id:'firewall', w:18, h:42, color:C.red,
    draw(c,x,y,w,h,t){
      c.save();
      const g=c.createLinearGradient(x,y,x+w,y+h);
      g.addColorStop(0,'#FF2244CC');g.addColorStop(0.5,'#FF8800AA');g.addColorStop(1,'#FF2244CC');
      c.fillStyle=g;roundRect(c,x,y,w,h,3);c.fill();glow(c,C.red,10);
      for(let i=0;i<3;i++){
        c.fillStyle=`rgba(255,${120+Math.sin(t*0.1+i)*80},0,0.7)`;
        c.beginPath();const fx=x+w*0.2+i*(w*0.25),fh=6+Math.sin(t*0.08+i*1.2)*4;
        c.moveTo(fx,y);c.lineTo(fx-4,y-fh);c.lineTo(fx+4,y-fh);c.closePath();c.fill();
      }
      c.fillStyle='#fff';c.font='bold 7px monospace';c.textAlign='center';c.fillText('FW',x+w/2,y+h/2+3);
      c.restore();
    }
  },
  { id:'glitch', w:26, h:26, color:C.green,
    draw(c,x,y,w,h,t){
      c.save();const s=Math.sin(t*0.2)*3;
      c.fillStyle=C.green+'99';c.fillRect(x+s,y,w,h/3);
      c.fillStyle=C.cyan+'99';c.fillRect(x-s,y+h/3,w,h/3);
      c.fillStyle=C.magenta+'99';c.fillRect(x+s*0.5,y+2*h/3,w,h/3);
      glow(c,C.green,10);c.strokeStyle=C.green;c.lineWidth=1;c.strokeRect(x,y,w,h);
      c.fillStyle='#fff';c.font=`bold ${h*0.5}px monospace`;c.textAlign='center';
      c.fillText('?',x+w/2+s,y+h*0.72);c.restore();
    }
  },
  // TALL obstacle — requires double jump to clear
  { id:'tower', w:20, h:52, color:C.orange,
    draw(c,x,y,w,h,t){
      c.save();
      const g=c.createLinearGradient(x,y,x,y+h);
      g.addColorStop(0,C.orange+'FF');g.addColorStop(1,'#440000');
      c.fillStyle=g;roundRect(c,x,y,w,h,2);c.fill();glow(c,C.orange,12);
      // warning stripes
      c.fillStyle='rgba(255,200,0,0.3)';
      for(let i=0;i<3;i++)c.fillRect(x,y+i*(h/3),w,h/6);
      // blinking top light
      if(Math.floor(t/15)%2===0){
        c.fillStyle=C.yellow;glow(c,C.yellow,15);
        c.beginPath();c.arc(x+w/2,y-4,4,0,Math.PI*2);c.fill();
      }
      c.fillStyle='#fff';c.font='bold 7px monospace';c.textAlign='center';c.fillText('!!',x+w/2,y+h/2+3);
      c.restore();
    }
  },
];

// Aerial obstacles (come from top — need to duck or stay low)
const AERIAL_OBS = [
  { id:'drone', w:36, h:18, color:C.purple, aerial:true,
    // floats at head height — you must duck under it
    yOffset: -10, // relative to GROUND_Y - player.h - this.h
    draw(c,x,y,w,h,t){
      c.save();
      const hover = Math.sin(t*0.06)*3;
      const ry = y + hover;
      // body
      c.fillStyle='#220033';glow(c,C.purple,12);
      roundRect(c,x+w*0.2,ry+h*0.2,w*0.6,h*0.6,4);c.fill();
      // wings/rotors
      c.strokeStyle=C.purple;c.lineWidth=2;
      c.beginPath();c.moveTo(x,ry+h*0.5);c.lineTo(x+w,ry+h*0.5);c.stroke();
      // rotor spin
      const rs=t*0.3;
      [[x+4,ry+h*0.5],[x+w-4,ry+h*0.5]].forEach(([rx,ry2])=>{
        c.beginPath();
        c.moveTo(rx+Math.cos(rs)*8,ry2+Math.sin(rs)*3);
        c.lineTo(rx+Math.cos(rs+Math.PI)*8,ry2+Math.sin(rs+Math.PI)*3);
        c.stroke();
      });
      // eye
      c.fillStyle=C.red;glow(c,C.red,10);
      c.beginPath();c.arc(x+w/2,ry+h*0.5,3,0,Math.PI*2);c.fill();
      // laser beam
      c.strokeStyle=`rgba(255,0,68,${0.3+Math.sin(t*0.1)*0.2})`;
      c.lineWidth=1;c.beginPath();
      c.moveTo(x+w/2,ry+h);c.lineTo(x+w/2,GROUND_Y);c.stroke();
      c.restore();
    }
  },
  { id:'bolt', w:14, h:40, color:C.yellow, aerial:true,
    yOffset: -20,
    draw(c,x,y,w,h,t){
      c.save();
      glow(c,C.yellow,16);
      c.fillStyle=C.yellow;
      // zigzag lightning bolt shape
      c.beginPath();
      c.moveTo(x+w*0.7,y);
      c.lineTo(x+w*0.3,y+h*0.45);
      c.lineTo(x+w*0.65,y+h*0.45);
      c.lineTo(x+w*0.2,y+h);
      c.lineTo(x+w*0.55,y+h*0.55);
      c.lineTo(x+w*0.2,y+h*0.55);
      c.closePath();c.fill();
      // flicker
      c.globalAlpha=0.4+Math.random()*0.4;
      c.fillStyle='#fff';c.fill();
      c.globalAlpha=1;
      c.restore();
    }
  },
];

// ─── OBSTACLE SPAWNING ──────────────────────────────────
let obstacles = [];
let obstacleTimer = 0;
let obstacleInterval = 90;
let lastWasAerial = false;

function getGroundObsTypes() {
  // Level 1: only small ground obs; level 2+: include tower
  if (level < 2) return GROUND_OBS.filter(o=>o.id!=='tower');
  return GROUND_OBS;
}

function spawnObstacle() {
  // Aerial obstacles available from level 2+
  const canAerial = level >= 2;
  // Avoid two aerials in a row
  const doAerial = canAerial && !lastWasAerial && Math.random() < 0.28;
  lastWasAerial = doAerial;

  if (doAerial) {
    const type = AERIAL_OBS[Math.floor(Math.random()*AERIAL_OBS.length)];
    const baseY = GROUND_Y - player.h - type.h + (type.yOffset||0);
    obstacles.push({
      x: W+20,
      y: baseY,
      w: type.w, h: type.h,
      type, aerial: true,
    });
  } else {
    const pool = getGroundObsTypes();
    const type = pool[Math.floor(Math.random()*pool.length)];
    obstacles.push({
      x: W+20,
      y: GROUND_Y - type.h,
      w: type.w, h: type.h,
      type, aerial: false,
    });
  }
}

// ─── LEVEL SYSTEM ───────────────────────────────────────
function checkLevelUp() {
  const newLevel = 1 + Math.floor(gameTime / 20); // level up every 20s
  if (newLevel > level) {
    level = newLevel;
    levelUpTimer = 120;
    levelUpMsg = `LEVEL ${level} — SYSTEM ESCALATION`;
    playSound('levelup');
    // Tighten spawn interval
    obstacleInterval = Math.max(38, 90 - (level-1)*10);
  }
}

// ─── DRAW ROBOT ─────────────────────────────────────────
function drawRobot(x, y, w, h, t, grounded, ducking) {
  ctx.save();
  const dh = ducking ? h*0.55 : h;
  const dy = ducking ? y + h - dh : y;
  const cx = x + w/2;
  const legOffset = grounded ? Math.sin(t*0.25)*4 : 0;

  player.trail.forEach((p,i)=>{
    const alpha=(i/player.trail.length)*0.3;
    ctx.fillStyle=`rgba(0,255,255,${alpha})`;
    ctx.fillRect(p.x+w*0.2,p.y+dh*0.2,w*0.6,dh*0.6);
  });

  if (!ducking) {
    ctx.fillStyle='#1a1a3a';glow(ctx,C.cyan,6);
    ctx.fillRect(cx-w*0.35,dy+dh*0.65,w*0.2,dh*0.25+legOffset);
    ctx.fillRect(cx+w*0.15,dy+dh*0.65,w*0.2,dh*0.25-legOffset);
    ctx.fillStyle=C.cyan+'88';
    ctx.fillRect(cx-w*0.4,dy+dh*0.9+legOffset,w*0.25,dh*0.1);
    ctx.fillRect(cx+w*0.1,dy+dh*0.9-legOffset,w*0.25,dh*0.1);
  } else {
    ctx.fillStyle='#1a1a3a';glow(ctx,C.cyan,4);
    ctx.fillRect(cx-w*0.45,dy+dh*0.8,w*0.9,dh*0.2);
  }

  const bodyGrad=ctx.createLinearGradient(cx-w*0.4,dy+dh*(ducking?0.1:0.28),cx+w*0.4,dy+dh*0.65);
  bodyGrad.addColorStop(0,'#1a1a4a');bodyGrad.addColorStop(0.5,'#0d0d2a');bodyGrad.addColorStop(1,'#1a1a4a');
  ctx.fillStyle=bodyGrad;glow(ctx,C.cyan,8);
  roundRect(ctx,cx-w*0.4,dy+dh*(ducking?0.1:0.28),w*0.8,dh*(ducking?0.7:0.4),4);ctx.fill();
  ctx.fillStyle=C.cyan;glow(ctx,C.cyan,15);
  ctx.beginPath();ctx.arc(cx,dy+dh*0.48,4,0,Math.PI*2);ctx.fill();

  if (!ducking) {
    ctx.fillStyle='#1a1a3a';glow(ctx,C.magenta,5);
    const armSwing=grounded?Math.sin(t*0.25+Math.PI)*5:3;
    ctx.fillRect(cx-w*0.55,dy+dh*0.3+armSwing,w*0.15,dh*0.25);
    ctx.fillRect(cx+w*0.4,dy+dh*0.3-armSwing,w*0.15,dh*0.25);
    const headGrad=ctx.createLinearGradient(cx-w*0.35,dy,cx+w*0.35,dy+dh*0.3);
    headGrad.addColorStop(0,'#1a1a4a');headGrad.addColorStop(1,'#0d0d2a');
    ctx.fillStyle=headGrad;glow(ctx,C.cyan,10);
    roundRect(ctx,cx-w*0.35,dy,w*0.7,dh*0.32,5);ctx.fill();
    const visorGrad=ctx.createLinearGradient(cx-w*0.28,dy+dh*0.07,cx+w*0.28,dy+dh*0.22);
    visorGrad.addColorStop(0,C.cyan+'CC');visorGrad.addColorStop(0.5,C.cyan+'FF');visorGrad.addColorStop(1,C.magenta+'88');
    ctx.fillStyle=visorGrad;glow(ctx,C.cyan,18);
    roundRect(ctx,cx-w*0.28,dy+dh*0.07,w*0.56,dh*0.18,3);ctx.fill();
    ctx.strokeStyle=C.magenta;ctx.lineWidth=2;glow(ctx,C.magenta,8);
    ctx.beginPath();ctx.moveTo(cx,dy);ctx.lineTo(cx,dy-dh*0.12);ctx.stroke();
    ctx.fillStyle=C.magenta;ctx.beginPath();ctx.arc(cx,dy-dh*0.12,3,0,Math.PI*2);ctx.fill();
  }
  clearGlow(ctx);ctx.restore();
}

// ─── BACKGROUND ─────────────────────────────────────────
function drawBackground(){
  const skyGrad=ctx.createLinearGradient(0,0,0,GROUND_Y);
  skyGrad.addColorStop(0,'#010108');skyGrad.addColorStop(0.6,'#05051a');skyGrad.addColorStop(1,'#0a0520');
  ctx.fillStyle=skyGrad;ctx.fillRect(0,0,W,GROUND_Y);
  BUILDINGS.forEach(b=>{
    const px=((b.x-groundOffset*0.3)%(W+b.w+100))-b.w;
    const by=GROUND_Y-b.h;
    ctx.fillStyle='#080818';ctx.fillRect(px,by,b.w,b.h);
    const cols=Math.floor(b.w/14),rows=Math.floor(b.h/18);
    for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){
      const idx=(r*cols+c)%b.windows.length,win=b.windows[idx];
      win.timer--;if(win.timer<=0){win.on=Math.random()>0.3;win.timer=60+Math.floor(Math.random()*200);}
      if(win.on){
        const wx=px+4+c*14,wy=by+4+r*18;
        ctx.fillStyle=b.color+'66';glow(ctx,b.color,6);ctx.fillRect(wx,wy,8,10);clearGlow(ctx);
      }
    }}
    ctx.fillStyle=b.color+'44';glow(ctx,b.color,8);ctx.fillRect(px,by,b.w,2);clearGlow(ctx);
  });
  ctx.font='10px Share Tech Mono';
  RAIN.forEach(r=>{
    ctx.fillStyle=`rgba(0,255,65,${r.alpha})`;ctx.fillText(r.char,r.x,r.y);
    r.y+=r.speed;if(r.y>GROUND_Y){r.y=-r.len;r.x=Math.random()*W;r.char=Math.floor(Math.random()*10);}
  });
}

function drawGround(){
  const gGrad=ctx.createLinearGradient(0,GROUND_Y,0,H);
  gGrad.addColorStop(0,'#0a0520');gGrad.addColorStop(1,'#000005');
  ctx.fillStyle=gGrad;ctx.fillRect(0,GROUND_Y,W,H-GROUND_Y);
  ctx.strokeStyle=C.cyan+'22';ctx.lineWidth=1;
  for(let y=GROUND_Y;y<H;y+=15){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  const gs=40,off=groundOffset%gs;
  for(let x=-off;x<W+gs;x+=gs){ctx.beginPath();ctx.moveTo(x,GROUND_Y);ctx.lineTo(x,H);ctx.stroke();}
  ctx.strokeStyle=C.cyan;ctx.lineWidth=2;glow(ctx,C.cyan,12);
  ctx.beginPath();ctx.moveTo(0,GROUND_Y);ctx.lineTo(W,GROUND_Y);ctx.stroke();clearGlow(ctx);
}

function drawScanlines(){ctx.fillStyle='rgba(0,0,0,0.03)';for(let y=0;y<H;y+=3)ctx.fillRect(0,y,W,1);}
function drawVignette(){
  const vg=ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.9);
  vg.addColorStop(0,'transparent');vg.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}

function drawLevelUp(){
  if(levelUpTimer<=0)return;
  const alpha=Math.min(1,levelUpTimer/30);
  ctx.globalAlpha=alpha;
  ctx.textAlign='center';
  ctx.font='bold 16px Orbitron';
  glow(ctx,C.green,20);
  ctx.fillStyle=C.green;
  ctx.fillText(levelUpMsg,W/2,GROUND_Y/2+8);
  clearGlow(ctx);
  ctx.globalAlpha=1;
  levelUpTimer--;
}

// ─── SCREENS ────────────────────────────────────────────
function drawStartScreen(){
  ctx.textAlign='center';
  ctx.font='900 28px Orbitron';glow(ctx,C.cyan,20);ctx.fillStyle=C.cyan;
  ctx.fillText('IT DEPARTMENT',W/2,H/2-55);
  ctx.font='900 38px Orbitron';glow(ctx,C.magenta,25);ctx.fillStyle=C.magenta;
  ctx.fillText('CYBER RUNNER',W/2,H/2-14);clearGlow(ctx);
  ctx.font='12px Share Tech Mono';ctx.fillStyle=C.green;glow(ctx,C.green,8);
  ctx.fillText('[ INNOVATION & TECHNOLOGY ]',W/2,H/2+16);clearGlow(ctx);
  ctx.font='10px Share Tech Mono';ctx.fillStyle=C.white+'99';
  ctx.fillText('SPACE/TAP = JUMP  ·  DUCK KEY(↓/S) = DUCK',W/2,H/2+36);
  if(Math.floor(frame/30)%2===0){
    ctx.font='13px Share Tech Mono';ctx.fillStyle=C.white;
    ctx.fillText('PRESS SPACE / TAP TO START',W/2,H/2+56);
  }
  if(hi>0){ctx.font='11px Share Tech Mono';ctx.fillStyle=C.magenta+'AA';ctx.fillText(`BEST SCORE: ${fmt(hi)}`,W/2,H/2+76);}
}

function drawDeadScreen(){
  ctx.fillStyle=`rgba(255,0,68,${0.05+Math.random()*0.05})`;ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.font='900 32px Orbitron';glow(ctx,C.red,20);ctx.fillStyle=C.red;
  ctx.fillText('SYSTEM CRASH',W/2,H/2-40);clearGlow(ctx);
  ctx.font='13px Share Tech Mono';ctx.fillStyle=C.white;
  ctx.fillText(`SCORE: ${fmt(score)}  ·  LEVEL ${level}`,W/2,H/2);
  if(score>=hi){ctx.font='11px Share Tech Mono';glow(ctx,C.yellow,8);ctx.fillStyle=C.yellow;ctx.fillText('✦ NEW BEST SCORE ✦',W/2,H/2+22);clearGlow(ctx);}
  if(Math.floor(frame/30)%2===0){ctx.font='13px Share Tech Mono';ctx.fillStyle=C.cyan;ctx.fillText('PRESS SPACE / TAP TO REBOOT',W/2,H/2+48);}
}

// ─── GAME LOGIC ─────────────────────────────────────────
function startGame(){
  state='playing';score=0;speed=4;gameTime=0;level=1;levelUpTimer=0;
  obstacles=[];obstacleTimer=0;obstacleInterval=90;lastWasAerial=false;
  player.y=GROUND_Y-player.h;player.vy=0;player.jumps=0;
  player.grounded=true;player.trail=[];player.ducking=false;
  particles=[];
}

function updatePlayer(){
  player.trail.push({x:player.x,y:player.y});
  if(player.trail.length>6)player.trail.shift();
  if(!player.ducking){player.vy+=0.55;player.y+=player.vy;}
  if(player.y>=GROUND_Y-player.h){
    player.y=GROUND_Y-player.h;player.vy=0;player.grounded=true;player.jumps=0;
  } else {player.grounded=false;}
  player.animTimer++;if(player.animTimer>8){player.animFrame++;player.animTimer=0;}
}

function updateObstacles(){
  obstacleTimer++;
  if(obstacleTimer>=obstacleInterval){
    spawnObstacle();obstacleTimer=0;
    // Dynamic interval based on level
    const base=Math.max(45,90-gameTime*0.4);
    obstacleInterval=base;
  }
  obstacles=obstacles.filter(o=>o.x+o.w>-10);
  obstacles.forEach(o=>{o.x-=speed;});
}

function checkCollision(){
  const margin=5;
  const dh=player.ducking?player.h*0.55:player.h;
  const dy=player.ducking?player.y+player.h-dh:player.y;
  const px=player.x+margin,py=dy+margin,pw=player.w-margin*2,ph=dh-margin*2;
  for(const o of obstacles){
    if(px<o.x+o.w&&px+pw>o.x&&py<o.y+o.h&&py+ph>o.y)return true;
  }
  return false;
}

function updateGame(){
  gameTime+=1/60;
  score+=speed*0.1;
  speed=4+gameTime*0.28;
  groundOffset+=speed;
  checkLevelUp();
  updatePlayer();
  updateObstacles();
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;p.life-=p.decay;});
  particles=particles.filter(p=>p.life>0);
  if(checkCollision()){
    spawnParticles(player.x+player.w/2,player.y+player.h/2,C.red,20);
    spawnParticles(player.x+player.w/2,player.y+player.h/2,C.cyan,15);
    playSound('crash');
    if(score>hi){hi=Math.floor(score);localStorage.setItem('cyberHi',hi);}
    state='dead';
  }
}

// ─── DRAW ───────────────────────────────────────────────
function draw(){
  ctx.clearRect(0,0,W,H);
  drawBackground();drawGround();
  if(state==='playing'||state==='dead'){
    obstacles.forEach(o=>o.type.draw(ctx,o.x,o.y,o.w,o.h,frame));
    particles.forEach(p=>{
      ctx.globalAlpha=p.life;ctx.fillStyle=p.color;glow(ctx,p.color,8);
      ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);clearGlow(ctx);
    });
    ctx.globalAlpha=1;
    drawRobot(player.x,player.y,player.w,player.h,player.animFrame,player.grounded,player.ducking);
    drawLevelUp();
  }
  drawScanlines();drawVignette();
  if(state==='start')drawStartScreen();
  if(state==='dead')drawDeadScreen();
  document.getElementById('scoreDisplay').textContent=fmt(score);
  document.getElementById('hiDisplay').textContent=fmt(hi);
  document.getElementById('levelDisplay').textContent=String(level).padStart(2,'0');
}

// ─── LOOP ───────────────────────────────────────────────
function loop(){
  frame++;
  if(state==='playing')updateGame();
  draw();
  requestAnimationFrame(loop);
}

// ─── INPUT ──────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump();}
  if(e.code==='ArrowDown'||e.code==='KeyS'){e.preventDefault();duck(true);}
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowDown'||e.code==='KeyS'){duck(false);}
});

// Touch: tap = jump, long press or swipe down = duck
let touchStartY=0,duckTimeout=null;
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  touchStartY=e.touches[0].clientY;
  duckTimeout=setTimeout(()=>duck(true),150);
},{passive:false});
canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  clearTimeout(duckTimeout);
  const dy=e.changedTouches[0].clientY-touchStartY;
  if(dy<20){jump();} // tap = jump
  duck(false);
},{passive:false});

canvas.addEventListener('mousedown',()=>jump());

player.y=GROUND_Y-player.h;
loop();
</script>
